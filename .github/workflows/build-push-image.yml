name: build-push-image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # GHCR rejects uppercase in image references ("RecipesApp" -> "recipesapp").
      - name: Compute image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy runtime files to the VM
        run: |
          ssh ubuntu@"$SSH_HOST" "sudo mkdir -p /opt/recipeapp && sudo chown ubuntu:ubuntu /opt/recipeapp"
          scp -o BatchMode=yes deploy/docker-compose.yml deploy/Caddyfile "ubuntu@$SSH_HOST:/opt/recipeapp/"

      # Regenerate .env on every deploy but keep an existing household password
      # (it is generated once on first deploy and never printed anywhere).
      # GROQ_* is only added when configured, so removing the secret disables
      # the LLM fallback again.
      - name: Write .env on the VM
        env:
          GHCR_REPO: ${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: |
          repo_lc="${GHCR_REPO,,}"
          ssh ubuntu@"$SSH_HOST" bash -s -- "$repo_lc" "$IMAGE_TAG" "$GROQ_KEY" "$GROQ_MODEL" <<'REMOTE'
          set -euo pipefail
          repo="$1"; tag="$2"; groq_key="$3"; groq_model="$4"
          cd /opt/recipeapp
          pw=""
          if [ -f .env ]; then
            pw="$(grep -E '^HOUSEHOLD_PASSWORD=' .env | cut -d= -f2- || true)"
          fi
          if [ -z "$pw" ]; then
            pw="$(openssl rand -hex 24)"
          fi
          umask 077
          cat > .env <<EOF
          GHCR_REPO=${repo}
          HOUSEHOLD_PASSWORD=${pw}
          IMAGE_TAG=${tag}
          EOF
          if [ -n "$groq_key" ]; then
            printf 'GROQ_API_KEY=%s\n' "$groq_key" >> .env
          fi
          if [ -n "$groq_model" ]; then
            printf 'GROQ_MODEL=%s\n' "$groq_model" >> .env
          fi
          REMOTE

      - name: Log GHCR into Docker on the VM
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh ubuntu@"$SSH_HOST" "sudo docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Pull and restart containers
        run: |
          ssh ubuntu@"$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/recipeapp
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sudo sh
          fi
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
          sudo docker image prune -f
          sudo docker compose ps
          REMOTE

      - name: Verify API health
        run: |
          ssh ubuntu@"$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          ok=""
          for i in $(seq 1 15); do
            if curl -fsS http://localhost/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::API health check failed after 45s"
            sudo docker compose -f /opt/recipeapp/docker-compose.yml logs --tail 50 api
            exit 1
          fi
          echo "API healthy."
          REMOTE
